[project]
name = "entre-languages"
version = "0.1.0"
description = "Language practice through chance encounters with AI characters"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
